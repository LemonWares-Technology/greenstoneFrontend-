name: Deploy React Frontend to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ==================== DEBUG STEP ====================
      - name: Test SSH Connection (Debug)
        run: |
          echo "${{ secrets.CPANEL_SSH_KEY }}" > /tmp/id_key
          chmod 600 /tmp/id_key
          echo "=== Testing SSH connection and shell cleanliness ==="
          ssh -i /tmp/id_key \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p 22 \
              ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} \
              "echo '=== CLEAN SHELL TEST SUCCESS ==='; echo 'Current shell: $SHELL'; exit 0" 2>&1
        continue-on-error: true   # So deployment still runs even if debug fails
      # ===================================================

      - name: Deploy to cPanel
        uses: Burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr --delete --exclude=".htaccess" --exclude="node_modules" --exclude=".git"
          path: ./dist/
          remote_path: /home/greenston/public_html
          remote_host: ${{ secrets.CPANEL_HOST }}
          remote_user: ${{ secrets.CPANEL_USERNAME }}
          remote_key: ${{ secrets.CPANEL_SSH_KEY }}
          remote_port: 22
          rsh: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"